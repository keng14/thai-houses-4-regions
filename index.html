/* VOICE: ครูสถาปัตย์ใจดี — โมเดลเป็นพระเอก ตัวหนังสือหลบไปอยู่ในแผงที่เรียกได้
   IDEA: โต๊ะช่างไม้ — เรือนจำลองวางกลางโต๊ะ เครื่องมือวางรอบขอบ
   PICTURE: ฉาก 3D เต็มจอ แผงควบคุมลอยแบบกระจกฝ้าอยู่ขอบจอ
   COLOUR and TYPE: ไม้สักเข้ม #24170e บนกระจกขาว สีประจำภาคเป็นสีเน้น / Mitr + Sarabun + Noto Sans SC
   LAYOUT: จอ 3D เต็มหน้าจอ · มุมซ้ายบนเลือกภาค/อาคาร · ขวาบนภาษาและเครื่องมือ · ล่างโหมดและปุ่มหลัก · ข้อมูลอยู่ในแผงแท็บ */
:root{color-scheme:light;--bg:#fbfaf7;--ink:#24170e;--mute:#6f5d4f;--line:#e8dfd4;--card:#ffffff;--soft:#f3eee7;--acc:#b8322a;--sheetW:420px}
@supports (color:light-dark(#000,#fff)){:root{color-scheme:light dark;--bg:light-dark(#fbfaf7,#14100d);--ink:light-dark(#24170e,#efe6dc);--mute:light-dark(#6f5d4f,#b5a594);--line:light-dark(#e8dfd4,#352a22);--card:light-dark(#ffffff,#1d1714);--soft:light-dark(#f3eee7,#221b16)}}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:#dfe8ee;color:var(--ink);font:16px/1.6 Sarabun,'Noto Sans SC',system-ui,sans-serif}
h1,h2,h3,h4{font-family:Mitr,'Noto Sans SC',Sarabun,sans-serif;font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
button{font-family:inherit}
button:focus-visible{outline:3px solid #e9b04a;outline-offset:2px}
.glass{background:rgba(255,255,255,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 2px 12px rgba(30,20,10,.16);color:#24170e}
.viewer{position:fixed;inset:0;overflow:hidden;background:#dfe8ee;touch-action:none;user-select:none;transition:right .25s,bottom .25s}
.viewer canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tl{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-start;gap:8px;max-width:calc(100% - 130px);z-index:3}
.pick{display:flex;align-items:center;gap:10px;border:0;border-radius:16px;padding:8px 12px 8px 9px;cursor:pointer;text-align:left;min-height:52px;max-width:100%}
.pick .dot{width:9px;height:34px;border-radius:5px;background:var(--acc);flex:none}
.pick b{display:block;font:600 18px/1.15 Mitr,'Noto Sans SC',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick small{display:block;font-size:12px;color:#6f5d4f;line-height:1.3}
.pick svg{width:20px;height:20px;stroke:#24170e;fill:none;stroke-width:2;flex:none}
.tag{padding:5px 11px;border-radius:11px;font:500 13px/1.35 Mitr,'Noto Sans SC',sans-serif;pointer-events:none}
.tag small{display:block;font:400 12px Sarabun,'Noto Sans SC',sans-serif;color:#6f5d4f}
.legend{display:flex;flex-wrap:wrap;gap:3px 10px;padding:6px 10px;border-radius:11px;font-size:12px;pointer-events:none}
.legend:empty{display:none}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:11px;height:11px;border-radius:3px;background:var(--z)}
.tr{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;z-index:3}
.tools{position:absolute;right:max(12px,env(safe-area-inset-right));top:calc(max(12px,env(safe-area-inset-top)) + 56px);display:flex;flex-direction:column;gap:8px;z-index:2}
.ib{width:44px;height:44px;border-radius:12px;border:0;display:grid;place-items:center;cursor:pointer}
.ib.txt{font:600 14px Mitr,'Noto Sans SC',sans-serif;width:auto;min-width:44px;padding:0 10px}
.ib svg{width:22px;height:22px;stroke:#24170e;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib[aria-pressed=true]{background:var(--acc)}.ib[aria-pressed=true] svg{stroke:#fff}
.ib .fs-out{display:none}.ib[aria-pressed=true] .fs-in{display:none}.ib[aria-pressed=true] .fs-out{display:block}
.menu{position:absolute;right:max(12px,env(safe-area-inset-right));top:calc(max(12px,env(safe-area-inset-top)) + 52px);z-index:6;border-radius:14px;padding:6px;display:flex;flex-direction:column;min-width:150px}
.menu button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:9px;font:500 15px Sarabun,'Noto Sans SC',sans-serif;cursor:pointer;color:#24170e;min-height:44px}
.menu button[aria-pressed=true]{background:#24170e;color:#fff}
.bot{position:absolute;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 12px;pointer-events:none;z-index:3}
.bot>*{pointer-events:auto}
.subv{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:5px;border-radius:14px;scrollbar-width:none}
.subv:empty{display:none}
.subv button{flex:none;border:0;background:transparent;font:600 14px Sarabun,'Noto Sans SC',sans-serif;min-height:38px;padding:6px 12px;border-radius:10px;cursor:pointer;color:#24170e}
.subv button[aria-pressed=true]{background:#24170e;color:#fff}
.subv hr{border:0;border-left:1px solid #cdbfb0;margin:4px 2px}
.dock{display:flex;align-items:stretch;gap:6px;padding:5px;border-radius:18px;max-width:100%}
.seg{display:grid;grid-template-columns:repeat(3,auto);gap:3px}.seg button{padding:0 10px!important;white-space:nowrap}
.seg button{border:0;background:transparent;border-radius:13px;min-height:50px;font:600 17px Mitr,'Noto Sans SC',sans-serif;color:#24170e;cursor:pointer;line-height:1.05;padding:0 4px}
.seg small{display:block;font:400 11px Sarabun,'Noto Sans SC',sans-serif;opacity:.8;margin-top:2px}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
.acts{display:flex;gap:3px;border-left:1px solid rgba(0,0,0,.1);padding-left:6px}
.act{border:0;background:transparent;border-radius:13px;width:58px;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:#24170e}
.act svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.act small{font:600 11px Sarabun,'Noto Sans SC',sans-serif;line-height:1.1;white-space:nowrap}
.act[aria-pressed=true]{background:#24170e;color:#fff}
.scale{position:absolute;right:16px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 128px);font-size:13px;text-align:center;pointer-events:none;color:#24170e;z-index:2}
.scale i{display:block;height:8px;border:2px solid #24170e;border-top:0;margin-bottom:2px}
.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:8px 14px;border-radius:999px;font-size:14px;pointer-events:none;transition:opacity .6s;white-space:nowrap}
.hint.off{opacity:0}
.lbls{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);background:rgba(255,255,255,.95);color:#24170e;border-left:5px solid var(--z);border-radius:7px;padding:2px 9px;font:600 13px/1.35 Sarabun,'Noto Sans SC',sans-serif;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.lbl small{display:block;font-weight:400;font-size:12px;color:#6f5d4f}
.lbls.cmp .lbl small{display:none}.lbls.cmp .lbl{font-size:12px;padding:1px 7px}
.lbl.st{background:#24170e;color:#fff;border-left-color:#d8a25a;font-size:12px}
.dimsv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.dimsv path{stroke:#b8322a;stroke-width:1.3;fill:none}.dimsv path.ext{stroke-width:.8;opacity:.75}
.dimsv text{font:600 12px Sarabun,'Noto Sans SC',sans-serif;fill:#9c2a22;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.dimsv text.big{font-size:13px}
.panel{width:min(440px,100%);border-radius:16px;padding:12px 14px}
.ph{display:flex;align-items:center;gap:8px}.ph b{font:600 15px Mitr,'Noto Sans SC',sans-serif;flex:1}.ph span{font-size:13px;color:#6f5d4f;white-space:nowrap}
.x{border:0;background:rgba(0,0,0,.07);width:36px;height:36px;border-radius:50%;cursor:pointer;color:inherit;font-size:14px;flex:none}
.pbar{height:5px;border-radius:3px;background:rgba(0,0,0,.08);margin:8px 0 6px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--acc);transition:width .4s}
.panel h4{margin:2px 0;font-size:17px}.panel p{margin:0;font-size:14px;color:#4d3e33;line-height:1.5}
.ctl{display:flex;justify-content:center;gap:10px;margin-top:8px}.ctl button{width:48px;height:42px;border-radius:12px;border:0;background:rgba(0,0,0,.06);cursor:pointer;display:grid;place-items:center}
.ctl svg{width:20px;height:20px;stroke:#24170e;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.ctl .pl{background:var(--acc)}.ctl .pl svg{stroke:#fff;fill:#fff}
.ctl .pl .i-play{display:none}.ctl .pl.paused .i-play{display:block}.ctl .pl.paused .i-pause{display:none}
.tabs3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:8px 0;background:rgba(0,0,0,.05);padding:3px;border-radius:12px}
.tabs3 button{border:0;background:transparent;border-radius:9px;min-height:38px;font:600 14px Sarabun,'Noto Sans SC',sans-serif;cursor:pointer;color:#24170e}.tabs3 button[aria-pressed=true]{background:#24170e;color:#fff}
.rng{display:flex;align-items:center;gap:10px;margin:4px 0 6px}.rng input{flex:1;accent-color:#2f7fb0;height:28px}.rng b{font:600 15px Mitr,'Noto Sans SC',sans-serif;min-width:96px;text-align:right;white-space:nowrap}
.st{display:inline-block;font-size:13px;font-weight:600;border-radius:999px;padding:2px 10px;margin-bottom:6px}.st.ok{background:#dcefd6;color:#25602a}.st.bad{background:#f8d9d4;color:#9c2a22}
/* แผงข้อมูล */
.sheet{position:fixed;z-index:20;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;top:0;right:0;bottom:0;width:var(--sheetW);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(30,20,10,.15)}
.app.so .viewer{right:var(--sheetW)}
.sh-h{display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--line);background:var(--card)}
.stabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.stabs button{flex:none;border:0;background:transparent;border-radius:999px;min-height:40px;padding:6px 14px;font:600 14px Sarabun,'Noto Sans SC',sans-serif;color:var(--mute);cursor:pointer}
.stabs button[aria-selected=true]{background:var(--acc);color:#fff}
.sh-b{overflow-y:auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom));flex:1;-webkit-overflow-scrolling:touch}
.cols{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.card h2{font-size:24px}
.eyebrow{color:var(--acc);font:500 14px Mitr,'Noto Sans SC',sans-serif;margin-bottom:4px}
.lead{font-size:16px;margin:8px 0 4px}
.sec{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.sec h3{font-size:16px;margin-bottom:4px}.sec p{margin:0;color:var(--mute);font-size:15px}
.feat{padding-left:1.3em;margin:10px 0 0}.feat li{margin:0 0 6px;font-size:15px}.feat li::marker{color:var(--acc);font-weight:600}
.dims{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.dims div{background:var(--soft);border-radius:12px;padding:8px 10px}.dims b{display:block;font:600 20px Mitr,sans-serif;white-space:nowrap}.dims span{font-size:13px;color:var(--mute)}
.zones{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.zone{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--z);border-radius:12px;padding:12px 14px}
.zone b{font:600 16px Mitr,'Noto Sans SC',sans-serif}.zone em{float:right;font-style:normal;color:var(--mute);white-space:nowrap;font-size:14px}
.zone p{margin:4px 0 0;color:var(--mute);font-size:15px}.zone small{display:block;color:var(--mute);font-size:13px;margin-top:4px}
.h3{font-size:20px}
.parts{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:8px}
.parts b{display:block;font:500 15px Mitr,'Noto Sans SC',sans-serif}.parts span{font-size:14px;color:var(--mute);line-height:1.5}
.joint{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.joint svg{width:96px;height:64px;background:#f3eee7;border-radius:10px}
.joint b{font:600 15px Mitr,'Noto Sans SC',sans-serif}.joint small{display:block;color:var(--acc);font-size:13px}.joint p{margin:2px 0 0;color:var(--mute);font-size:14px}
.src{font-size:13px;color:var(--mute);margin:12px 0 0}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 13px Mitr,'Noto Sans SC',sans-serif;color:var(--mute);background:var(--soft)}
td:first-child{font-weight:600;white-space:nowrap}
td:first-child i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;background:var(--c)}
.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 12px;padding-inline-start:7.4em;text-align:start;white-space:normal}.stack td::before{content:attr(data-l);float:inline-start;width:6.5em;margin-inline-start:-6.6em;color:var(--mute);font-weight:600}
.stack td:first-child{padding-inline-start:12px;font-size:16px}.stack td:first-child::before{display:none}
.note{font-size:13px;color:var(--mute);margin-top:12px}
.btn{font:600 15px Sarabun,'Noto Sans SC',sans-serif;min-height:44px;padding:8px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
/* ตัวเลือกภาค/อาคาร */
.pop{position:fixed;inset:0;background:rgba(20,12,6,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.pop-c{background:var(--bg);color:var(--ink);width:min(560px,100%);max-height:86dvh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.pop-c .ph b{font-size:18px}
.rgb{border-top:1px solid var(--line);padding:12px 0 4px;display:grid;grid-template-columns:10px minmax(0,1fr);gap:2px 12px;margin-top:10px}
.rgb>i{grid-row:1/4;border-radius:5px;background:var(--c)}
.rgb h3{font-size:19px}.rgb span{font-size:13px;color:var(--mute)}
.bl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.bl button{font:600 15px Sarabun,'Noto Sans SC',sans-serif;min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.bl button[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
.dlg{position:fixed;inset:0;background:rgba(20,12,6,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:70}
.dlg.on{display:flex}.dlg>div{background:var(--card);border-radius:16px;padding:14px;max-width:900px;width:100%}
.dlg img{width:100%;border-radius:10px;background:#fff}.dlg p{margin:8px 0;font-size:14px}
/* วิธีใช้ */
.tour{position:fixed;inset:0;z-index:80}
.spot{position:fixed;border-radius:16px;box-shadow:0 0 0 200vmax rgba(20,12,6,.62);transition:all .3s;pointer-events:none}
.tcard{position:fixed;background:var(--card);color:var(--ink);border-radius:16px;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.35);transition:top .3s,left .3s;max-width:calc(100vw - 24px)}
.tstep{font-size:13px;color:var(--acc);font-weight:600}.tcard h3{font-size:20px;margin:4px 0 6px}.tcard p{margin:0 0 14px;color:var(--mute)}
.tnav{display:flex;align-items:center;gap:8px}.tskip{border:0;background:none;color:var(--mute);font:600 14px Sarabun,'Noto Sans SC',sans-serif;cursor:pointer;min-height:44px;padding:0 4px}
.dots{flex:1;display:flex;gap:4px;justify-content:center}.dots i{width:6px;height:6px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--acc);width:16px}

:root{--r-sm:8px;--r-md:14px;--r-lg:20px;--gold:#c99a3c;--lacquer:#a6281f;--teak:#2b1a10;
  --shadow-1:0 1px 2px rgba(43,26,16,.08),0 4px 14px -6px rgba(43,26,16,.18);
  --shadow-2:0 2px 4px rgba(43,26,16,.06),0 18px 40px -16px rgba(43,26,16,.32)}

body{line-height:1.6;letter-spacing:.005em;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:var(--r-sm)}

.btn{border-radius:var(--r-md);min-height:46px;padding:9px 20px;box-shadow:var(--shadow-1);transition:transform .15s ease,box-shadow .2s ease,background .2s ease,border-color .2s ease}

.ib{border-radius:var(--r-md);box-shadow:var(--shadow-1);background:color-mix(in srgb,var(--card) 88%,transparent);transition:transform .15s ease,background .2s ease}
.ib:hover{transform:translateY(-1px)}
.ib:active{transform:scale(.96)}
.act,.seg button{transition:background .2s ease,color .2s ease,transform .15s ease}
.act:hover{background:color-mix(in srgb,var(--gold) 16%,transparent)}

   p:{khe:['ตะเข้ (จันทันมุม)','จันทันเอียงที่มุมหลังคาทรงปั้นหยาและมนิลา ทอดจากแปหัวเสาขึ้นถึงอกไก่ ถ่ายน้ำหนักหลังคาด้านเฉียงลงเสาดั้งมุม'],sao:['เสา (เสากลม)','เสาหลักฝังดินราว 1–1.5 เมตร (ยกเว้นภาคใต้ที่ตั้งบนตีนเสา) เอนสอบเข้าหากันราว 1–2 ซม. ต่อความสูง 1 เมตร ต้านแรงลมด้านข้างและบีบอัดโครงสร้างให้แน่นเมื่อรับน้ำหนักหลังคา'],rod:['รอด','คานยึดกับเสา รองรับตงและพื้นเรือน ปลายตงเข้าเดือยกับรอด'],tong:['ตง','ไม้วางพาดบนรอดเป็นระยะ รองรับแผ่นพื้น'],phrueng:['พรึง','คานรอบขอบพื้นเรือน รับปลายตงและเป็นฐานของฝา'],floor:['พื้นเรือน','แผ่นไม้พื้นเข้าลิ้นและรางต่อกันโดยไม่ใช้ตะปู'],ase:['แปหัวเสา (อะเส)','คานไม้พาดตามแนวยาวของเรือน วางบนหัวเสา รับน้ำหนักจากจันทันและถ่ายแรงลงสู่เสาอย่างสม่ำเสมอ'],khue:['ขื่อ','คานไม้พาดขวางตามแนวสกัด (ด้านกว้างของเรือน) รัดหัวเสาคู่ซ้าย-ขวาไม่ให้ถ่างออกจากกัน'],dang:['เสาดั้ง','เสาสั้นตั้งกึ่งกลางขื่อ ค้ำยันจุดสูงสุดของจั่ว'],okkai:['อกไก่','คานไม้วางบนหัวเสาดั้งตามแนวยาวของเรือน เป็นสันสูงสุดของหลังคา'],chanthan:['จันทัน','ไม้พาดเฉียงจากอกไก่ลงมาบนอะเสและยื่นเลยออกไปเป็นชายคา มีจันทันเอก (ตรงแนวเสา) และจันทันพราง (ระหว่างช่วงเสา)'],pae:['แปลาน','ไม้วางขวางบนจันทันตามแนวยาวหลังคา ยึดจันทันให้ทำงานร่วมกันและรองรับระแนง'],ranaeng:['ระแนง','ไม้เส้นเล็กตีถี่บนแป ใช้เกี่ยวกระเบื้องมุงหลังคา เช่น กระเบื้องดินเผาเกล็ดเต่า'],panlom:['ปั้นลม','ไม้ปิดขอบหลังคาด้านหน้าจั่ว กันลมตีกระเบื้อง ปลายบนเป็นหางหงส์'],ngao:['เหงาปั้นลม','ปลายล่างของปั้นลมที่ม้วนขึ้น เป็นลวดลายเฉพาะของเรือนไทยภาคกลาง'],lukfak:['ลูกฟักหน้าจั่ว','หน้าจั่วประกอบเป็นกรอบลูกฟักแบบฝาปะกน ถอดประกอบได้'],kansat:['กันสาด','หลังคาส่วนล่างที่ลาดน้อยกว่าหลังคาหลัก ยื่นต่อจากชายคาเพื่อกันแดดและฝนสาด'],taokhaen:['เต้าแขน','ไม้ค้ำเฉียงจากเสาขึ้นไปรับกันสาดที่ยื่นยาว'],lukkrong:['ลูกกรง','ซี่ไม้เรียงในกรอบลูกกรงรอบชาน กันตก']}},
  tb:['ข้าม','ย้อนกลับ','ถัดไป','เริ่มใช้งาน'],step:(i,n)=>`ขั้นที่ ${i} จาก ${n}`},
 r:[
 {name:'ภาคกลาง',tg:'ที่ราบลุ่ม · น้ำหลาก',
  intro:'พัฒนาขึ้นเพื่อรับมือกับพื้นที่ราบลุ่มแม่น้ำที่มีน้ำหลากตามฤดูกาลและอากาศร้อนชื้น',
  sec:[['โครงสร้างและรูปทรง','เสาเรือนสอบเข้าหากันเล็กน้อยเพื่อรับแรงลมและกระจายน้ำหนัก หลังคาทรงจั่วสูงชัน (45–60 องศา) เพื่อระบายน้ำฝนและถ่ายเทความร้อน ปลายจั่วประดับปั้นลมและตัวเหงา'],['การวางผัง','จัดวางเป็นกลุ่มเรือนรอบชานบ้านที่เปิดโล่ง มีหอนั่ง หอนอน เรือนครัว และหอนก เชื่อมต่อกันด้วยชานและระเบียง'],['ฝาผนัง','นิยมใช้ฝาปะกน (ไม้แผ่นเข้าลิ้นประกอบลูกฟัก) หรือฝาสายบัว หน้าต่างมีขนาดแคบและสอบขึ้นตามแนวเสา']],
  b:[
  {name:'หมู่เรือน',sub:'เรือนหลายหลังรอบชาน',f:['หอนอนอยู่ด้านในสุด เป็นเรือนหลังใหญ่และสูงที่สุด','หอนั่งเปิดโล่งด้านหน้า ฝาด้านหลังเป็นฝาสายบัว','เรือนครัวแยกอยู่อีกฝั่งของชาน ลดความเสี่ยงไฟไหม้','หอนกกรุระแนงโปร่ง ไว้เลี้ยงและชมนก','ชานกลางเชื่อมทุกเรือน บางบ้านเว้นช่องให้ต้นไม้ใหญ่ขึ้นผ่านชานเพื่อให้ร่มเงา','ระเบียงอยู่ใต้ชายคาหอนอน พื้นลดหลั่นจากเรือนสู่ระเบียงและชาน'],
   z:[['หอนอน','เรือนประธาน ใช้นอน ใหญ่และสูงที่สุดในหมู่เรือน'],['ระเบียง','พื้นใต้ชายคาหน้าหอนอน ลดระดับจากห้อง ใช้นั่งเล่นในร่ม'],['หอนั่ง','เรือนเปิดด้านหน้า ใช้นั่งเล่น รับแขก และพักผ่อนกลางวัน'],['เรือนครัว','หุงหาอาหาร แยกจากเรือนนอนเพื่อกันไฟและควัน'],['หอนก','เรือนเล็กกรุระแนง ใช้เลี้ยงและชมนก'],['ชานกลาง','ลานไม้กลางหมู่เรือน เชื่อมทุกเรือน ใช้ทำงานบ้าน ทำบุญ และรับแขกจำนวนมาก'],['ใต้ถุน','ใต้หอนอน โล่งและสูง ใช้เก็บเครื่องมือและนั่งพักกลางวัน']]},
  {name:'หอนอน',sub:'เรือนประธาน',f:['หลังคาจั่วสูงชัน 45–60 องศา (แบบจำลองใช้ 52 องศา) แอ่นโค้งเล็กน้อยคล้ายท้องเรือสำเภา ระบายน้ำฝนได้เร็ว','ปั้นลมปลายล่างเป็นตัวเหงา ปลายบนเป็นหางหงส์','เสาเอนสอบเข้าหากันราว 1–2 ซม. ต่อความสูง 1 เมตร ต้านแรงลมและบีบโครงสร้างให้แน่น','ฝาปะกน แผงไม้มีกรอบประกอบลูกฟัก','หน้าต่างแคบ สอบขึ้นตามแนวเสา บานเปิดออกแนบฝา','ไม้ค้ำยันรับชายคาที่ยื่นยาว','ใต้ถุนสูงพ้นน้ำหลาก'],
   z:[['ห้องนอน','ห้องปิดมิดชิด ใช้นอนและเก็บของมีค่า'],['ระเบียง','พื้นใต้ชายคา ลดระดับจากห้อง ใช้นั่งเล่นในร่ม'],['ชาน','ลานไม้เปิดโล่ง ใช้ทำงานบ้าน รับแขก และเชื่อมไปเรือนอื่น'],['ใต้ถุน','โล่งและสูง ใช้เก็บเครื่องมือ นั่งพักกลางวัน และให้น้ำไหลผ่านเมื่อน้ำหลาก']]},
  {name:'เรือนครัว',sub:'แยกจากหอนอน',f:['แยกเป็นอีกหลังจากหอนอน ลดความเสี่ยงไฟไหม้และกลิ่นควัน','ฝาไม้ระแนงตีเว้นร่อง ให้ควันและความร้อนระบายออก','หน้าจั่วแบบ "หน้าจั่วพระอาทิตย์" ไม้ระแนงตีเป็นรัศมี ช่วยระบายควัน','ในครัวมีแม่เตาไฟ เป็นกระบะไม้ใส่ดินรองเตา'],
   z:[['ครัว','ที่หุงหาอาหาร มีแม่เตาไฟเป็นกระบะไม้ใส่ดิน'],['ชานครัว','ที่ล้างและเตรียมอาหาร ตั้งโอ่งน้ำ'],['ใต้ถุน','เก็บฟืนและภาชนะ']]}]},
 {name:'ภาคเหนือ',tg:'ภูเขา · อากาศหนาว',
  intro:'เรือนล้านนา ออกแบบมาเพื่อป้องกันความหนาวเย็นในฤดูหนาวและลมแรงตามภูมิประเทศหุบเขา พื้นที่ภายในเรือนจึงค่อนข้างมิดชิดและอบอุ่น',
  sec:[['โครงสร้างและรูปทรง','หลังคาทรงจั่วลาดต่ำกว่าภาคกลาง ชายคายื่นยาวคลุมตัวเรือนเพื่อกันแดดและฝนสาด บนยอดจั่วมีไม้ไขว้เรียกว่า กาแล เชื่อว่าช่วยป้องกันสิ่งชั่วร้ายและยึดปั้นลม'],['การวางผัง','แบ่งพื้นที่เป็นเรือนนอนที่ปิดทึบ มีหน้าต่างบานเล็กมาก (หรือช่องลม ป่องเอี้ยม) เชื่อมต่อกับเติ๋น (พื้นที่อเนกประสงค์กึ่งเปิดโล่ง) และชานที่มีร้านน้ำ (หิ้งวางหม้อน้ำดื่ม) ตั้งอยู่ด้านหน้า'],['ฝาผนัง','ฝาผนังไม้ตีซ้อนเกล็ดหรือฝาไหล ลักษณะเด่นคือฝาเอนออก (ผายออกด้านบน ตรงข้ามกับภาคกลาง) เพื่อให้รับแสงสว่างและเพิ่มพื้นที่ใช้สอยภายใน']],
  b:[
  {name:'เรือนกาแล',sub:'เรือนแฝดล้านนา',f:['"กาแล" ไม้ไขว้บนยอดจั่ว ต่อจากปั้นลม เชื่อว่าช่วยป้องกันสิ่งชั่วร้ายและช่วยยึดปั้นลม','เรือนแฝด หลังคาจั่ว 2 หลังวางคู่กัน มีรางน้ำ "ฮ่องริน" รับน้ำฝนตรงกลาง (ดูได้จากแปลนหลังคา)','หลังคาลาด ชายคาคลุมต่ำ กันลมหนาว','ฝาไม้ตีซ้อนเกล็ด เอนผายออกด้านบน ตรงข้ามกับภาคกลาง ช่วยรับแสงและเพิ่มพื้นที่ใช้สอย','หน้าต่างห้องนอนเล็กมาก หรือเป็นช่องลม "ป่องเอี้ยม"','"หำยนต์" แผ่นไม้แกะสลักเหนือประตูห้องนอน เชื่อว่าช่วยป้องกันสิ่งไม่ดี'],
   z:[['ห้องนอน','ห้องนอนรวมของครอบครัว ผนังทึบ อบอุ่น มีหำยนต์เหนือประตู'],['เติ๋น','พื้นที่กึ่งเปิด ใช้รับแขก นั่งเล่น และเป็นที่นอนของแขก'],['ชาน','ชานโล่งต่ำกว่าเติ๋น ใช้ทำงานบ้านและตากของ'],['ร้านน้ำ','หิ้งวางหม้อน้ำดื่มพร้อมหลังคาเล็ก ไว้ต้อนรับผู้มาเยือน'],['ใต้ถุน','เก็บเครื่องมือการเกษตร และใช้เป็นที่ทำงาน']]},
  {name:'หลองข้าว',sub:'ยุ้งข้าวล้านนา',f:['เก็บข้าวเปลือกไว้กินตลอดปี','ยกพื้นสูง ใช้เสาหลายต้นช่วยรับน้ำหนักข้าว','ฝาผายออกด้านบน ชายคายื่นยาว ช่วยกันฝนสาด','ใต้ถุนโล่ง ลมผ่าน ลดความชื้น'],
   z:[['ห้องเก็บข้าว','เก็บข้าวเปลือกไว้กินตลอดปี'],['ใต้ถุน','วางเครื่องมือ และเป็นที่ร่มทำงาน']]}]},
 {name:'ภาคอีสาน',tg:'ที่ราบสูง · แล้งยาว',
  intro:'สะท้อนความเรียบง่าย สมถะ และสอดคล้องกับสภาพภูมิอากาศที่แห้งแล้งและร้อนจัด รวมถึงคติความเชื่อเรื่อง ฮีตสิบสอง คองสิบสี่',
  sec:[['โครงสร้างและรูปทรง','หลังคาทรงจั่วไม่สูงมาก มุงด้วยแป้นเกล็ดไม้ กระเบื้องดินขอ หรือหญ้าคา ไม่นิยมประดับลวดลายวิจิตรเหมือนภาคกลางหรือภาคเหนือ'],['การวางผัง','แบ่งประเภทตามการใช้งานและขนาดครอบครัว ได้แก่ เรือนเกย (มีเกย ชานพักลดระดับยื่นด้านหน้า สำหรับรับแขกและทำงานฝีมือ) เรือนแฝด (สองหลังสร้างคู่กัน มีรางน้ำ "ฮางฮิน" คั่นกลาง ใช้ชานร่วมกัน) และเรือนโข่ง (สร้างต่อจากเรือนใหญ่แต่มีเสาและโครงสร้างแยกกัน ไม่ใช้เสาร่วมกัน)'],['ฝาผนัง','ไม้กระดานตีแนวตั้งหรือแนวนอน บางส่วนใช้ไม้ไผ่สานขัดแตะ (ฝาแอ้ม) เจาะหน้าต่างขนาดเล็กและมีจำนวนน้อย เพื่อกันลมหนาวและฝุ่น']],
  b:[
  {name:'เรือนเกย',sub:'เรือนใหญ่และเกย',f:['"เรือนใหญ่" แบ่งเป็นห้องนอนและห้องบูชา ผนังทึบ หน้าต่างน้อย','"เกย" พื้นลดระดับหน้าเรือนใหญ่ มีหลังคาเพิงคลุม','"ชานแดด" ชานโล่งไม่มีหลังคา','ใต้ถุนสูง ใช้ทอผ้า วางแคร่ และเก็บเครื่องมือ','ฝา "แอ้ม" สานไม้ไผ่ใส่ในกรอบไม้','หลังคามุงหญ้า รูปทรงเรียบง่าย ตกแต่งน้อย'],
   z:[['ห้องเปิง','ห้องบูชาผีเรือนและเก็บของสำคัญ คนนอกไม่เข้า'],['ห้องพ่อแม่','ห้องนอนของพ่อแม่ เจ้าของเรือน'],['ห้องส้วม','ห้องนอนของลูกสาวกับลูกเขย (ภาษาอีสาน "ส้วม" ในที่นี้คือห้องนอน)'],['เกย','พื้นลดระดับมีหลังคาคลุม ใช้รับแขก กินข้าว นอนพักกลางวัน'],['ชานแดด','ชานโล่ง ใช้ตากพืชผลและเป็นทางขึ้นเรือน'],['ใต้ถุน','ใช้ทอผ้า วางแคร่นั่งพัก และเก็บเครื่องมือ']]},
  {name:'เล้าข้าว',sub:'ยุ้งข้าวอีสาน',f:['ยุ้งเก็บข้าวเปลือก ตั้งแยกจากเรือน','ยกพื้นสูง กันความชื้นและหนู','ไม่มีหน้าต่าง ประตูเล็ก ใช้บันไดพาดขึ้นลง','ฝาเอียงผายออกเล็กน้อย ช่วยกันฝนสาด'],
   z:[['ห้องเก็บข้าว','เก็บข้าวเปลือก ประตูเล็ก ปีนขึ้นด้วยบันได'],['ใต้ถุน','ใต้ถุนโล่ง ช่วยให้ยุ้งแห้งไม่ชื้น']]}]},
 {name:'ภาคใต้',tg:'ฝนชุก · ลมมรสุม',
  intro:'สร้างขึ้นเพื่อรับมือกับมรสุม ฝนตกชุกเกือบตลอดปี ลมพายุแรง และความชื้นสูงจากพื้นดิน',
  sec:[['โครงสร้างและรูปทรง','ไม่ฝังเสาลงดิน แต่ตั้งวางบนตีนเสา (แผ่นหินหรือตอม่อปูน) เพื่อป้องกันความชื้นและปลวก และปรับระดับหรือเคลื่อนย้ายเรือนได้ง่าย หลังคามีทั้งทรงจั่ว ทรงปั้นหยา (รับแรงลมได้ดีทุกทิศทาง) และทรงมนิลา (ผสมจั่วกับปั้นหยา ประดับไม้ฉลุลาย)'],['การวางผัง','เน้นความโปร่งโล่ง มีชานและนอกชานเชื่อมต่อระหว่างเรือนนอนกับเรือนครัว พื้นเรือนยกระดับลดหลั่นตามลำดับความสำคัญของพื้นที่ใช้สอย'],['ฝาผนัง','นิยมใช้ฝาปะกนหรือฝาตีซ้อนเกล็ด มีช่องลมเหนือประตูหน้าต่าง (ฝาโปร่งหรือช่องแสงฉลุลาย) ให้อากาศถ่ายเทและไล่ความชื้นตลอดเวลา']],
  b:[

  {name:'เรือนมนิลา',sub:'หลังคาจั่วผสมปั้นหยา',f:['หลังคาทรงมนิลา ส่วนล่างลาดแบบปั้นหยา ส่วนบนเป็นหน้าจั่วเล็ก ต้านลมได้ดีและระบายอากาศใต้หลังคา','หน้าจั่วประดับไม้ฉลุลาย เป็นช่องระบายความร้อน','ช่องลมเหนือประตูและหน้าต่างช่วยไล่ความชื้นตลอดเวลา','มีชานและนอกชาน ลดระดับลงตามลำดับความสำคัญของพื้นที่','ตั้งบนตีนเสา ไม่ฝังเสาลงดิน'],
   z:[['โถงนั่งเล่น','พื้นที่หลักของเรือน นั่งเล่นและรับแขก'],['ห้องนอน','ห้องนอนปิด มีช่องลมเหนือหน้าต่าง'],['ชาน','ชานหน้าเรือน ต่ำกว่าพื้นเรือนเล็กน้อย'],['นอกชาน','ชานชั้นนอกสุด ต่ำลงอีกระดับ ใช้ทำงานและเป็นทางขึ้นเรือน'],['ใต้ถุน','เตี้ย ลมผ่าน ใช้เก็บของ']]}]}]},
en:{
 ui:{title:'Thai Houses of 4 Regions',sub:'Vernacular architecture teaching tool · 3D · 2D · X-ray',m:['Plans · elevations','Realistic','See-through'],xr:'X-ray',
  views:['Floor plan','Front','Back','Left','Right','Roof plan'],vt:['Floor plan','Front elevation','Rear elevation','Left elevation','Right elevation','Roof plan'],vs:['Plan view to scale','Orthographic drawing to scale','Orthographic drawing to scale','Orthographic drawing to scale','Orthographic drawing to scale','View from above'],
  lv:['Floor','Under-floor'],lvT:['Floor level','Under-floor level'],cut:h=>`Horizontal cut at ${h} m`,t3:['3D','Rotate, zoom and pan in any direction'],tx:['X-ray','See through walls and roof to the rooms'],
  h3:'Drag to rotate · pinch to zoom',heye:'Drag to look around · scroll to change field of view',h2:'Drag to pan · pinch to zoom',tools:{dimBtn:'Dimensions',asmBtn:'Assemble the house',clBtn:'Climate',lblBtn:'Room labels',styleBtn:'Line / colour',spinBtn:'Auto-rotate',eyeBtn:'Eye-level view',resetBtn:'Reset view',snap:'Snapshot',fsBtn:'Full screen'},help:'How to use',
  about:r=>`About ${r} Thai houses`,dims:['Length','Width','Height'],m_:'m',sqm:'m²',dimsNote:'Includes eaves, terraces and stairs · the figure beside the house is about 1.7 m tall for scale',
  zonesH:'Room uses',cmpH:'Comparing Thai houses of the four regions',ground:'Ground level',above:h=>`${h} m above ground`,meter:'m',snapP:'Long-press or right-click the image to save it for worksheets.',close:'Close',
  note:'This model simplifies details for teaching. Proportions, sizes and room divisions approximate typical houses of each region; real houses vary by locality and builder.',
  zt:{sleep:'Sleeping/rest',social:'Living/guests',cook:'Kitchen/water',out:'Terrace/outdoor',work:'Under-floor/work',store:'Rice/storage',holy:'Shrine/ritual'},
  cmp:[['Region','Roof','Under-floor','Walls','Look for'],['Central','Steep gable 45–60°, long eaves','Very high, above floods','Pakon or Sai Bua, leaning inward','Panlom, Tua Ngao, houses around a terrace'],['North','Low gable, long low eaves','Medium','Clapboard or Fa Lai, flaring outward','Kalae, Hong Rin, Toen, Ran Nam'],['Northeast','Low gable of shingles, clay tiles or grass','High, used for weaving and storage','Aem bamboo or boards','Main house, Koei, Chan Daed'],['South','Gable, hip or Manila','Low, on Tin Sao footings','Pakon or clapboard, with vents','Tin Sao, vents above windows, Nok Chan']],
  tabs:['Overview','Rooms','Structure','Compare'],dock:['Build','Climate','Info'],pickT:'Choose a region and building',
  tour:[['Welcome','A teaching tool for Thai houses of four regions, in 3D, plans, elevations and X-ray. Here is a one-minute tour.'],['Region and building','Tap here to choose the Central, North, Northeast or South, and a building in that region.'],['Language','Switch between Thai, English and Chinese at any time.'],['View mode','3D shows a realistic model · 2D shows plans and elevations as drawings · X-ray sees through walls to show the rooms.'],['Rotate and zoom','Drag to rotate, pinch or scroll to zoom, two-finger drag or right-click to pan.'],['Plans and elevations','In 2D, choose the floor plan, four elevations or the roof plan, with dimensions and under-floor height.'],['Structure in X-ray','In X-ray, tap "Structure" to name the parts: posts, tie beams, wall plates, king posts, ridge beam, rafters, purlins and the lower eave.'],['Build and climate','"Build" assembles the house piece by piece · "Climate" simulates floods, rain and wind.'],['Tools','Dimensions · Labels · Line or colour · Auto-rotate · Reset view · Snapshot · Full screen'],['Background notes','Tap "Info" to open the region overview, room uses, structure and comparison table without hiding the house.']],
  dimL:{u:'Under-floor',w:'Walls',r:'Roof',all:'Overall',body:'House'},
  asm:{t:'Assembling a house',done:'Assembly complete · press play to watch again',s:{foot:['Set the footings','Stone slabs or concrete piers carry the posts, keeping out damp and termites.'],post:['Raise the posts','House and terrace posts go up; house posts lean slightly inward. Where there are no footings, posts are buried about 1–1.5 m.'],frame:['Floor beams, joists, rim','Floor beams are slotted into the posts, joists laid on them and rim beams set around the edge, fixed with tenons and wedges.'],floor:['Lay the floor','House and terrace floorboards are fitted tongue-and-groove without nails.'],wall:['Lift the walls','Wall panels such as Pakon are made on the ground, then lifted between the posts one by one.'],khue:['Tie beams and wall plates','Wall plates run along the house and tie beams across it, binding the post heads; brackets go in for the lower eave.'],dang:['King posts and ridge','King posts stand on the tie beams and carry the ridge beam.'],rafter:['Rafters','Rafters run from the ridge down over the wall plates, notched so they cannot slide.'],pae:['Purlins and battens','Purlins are laid across the rafters, then close-set battens for hanging tiles.'],gable:['Gables and bargeboards','The gable panels are lifted into place and the bargeboards and finials fixed.'],tile:['Roofing','Tiles, shingles or thatch go on, the ridge is capped and the lower eave covered.'],detail:['Stairs and railings','Stairs, balustrades and fittings are added. The house is ready to live in.']}},
  cl:{t:'Why are the houses built this way?',tabs:['Flood','Rain','Wind'],lv:h=>`Water level ${h} m`,fl:h=>`Floor at ${h} m`,ok:d=>`Floor still ${d} m above water`,bad:'Water has reached the floor',ang:a=>`Roof pitch ${a}°`,
   flood:['The tall under-floor space lets floodwater flow beneath the house, so the house does not block it and belongings upstairs stay safe.','Medium-height stilts: hillside homes rarely flood, but the gap still keeps out ground damp.','Tall stilts clear seasonal floods and give a cool, shaded workspace in the dry season.','Low stilts, because resisting wind matters more than floods here; footings keep out ground damp.'],
   rain:['The steep roof sheds rain quickly so it never pools on the tiles; eaves and the lower eave carry water away from the walls.','Long, low eaves carry rain away from the house; the twin house has a Hong Rin gutter in the middle.','A moderate gable of grass or shingles drains well enough for the shorter rainy season.','Rain falls most of the year; eaves wrap the house against driving rain and vents clear damp afterwards.'],
   wind:['Breezes pass under the floor and through windows to carry heat away; inward-leaning posts resist side winds.','Solid walls, small windows and low eaves keep cold winds out.','Small, few windows keep out cold wind and dust in the dry season; the open under-floor lets breezes cool the house.','Strong monsoons: low stilts reduce wind load, and hip and Manila roofs have no large gable to catch the wind.']},
  xs:['Room uses','Structure'],
  st:{h:'Structure',
   
   partsH:'Named parts',see:'See the parts in X-ray',
   p:{khe:['Hip rafter (Khe)','Diagonal rafter at a hip corner, running from the eave plate up to the ridge and carrying the slope load to the corner post.'],sao:['Post (Sao)','Main posts are buried 1–1.5 m (except in the South, where they stand on footings) and lean inward about 1–2 cm per metre, resisting side winds and pressing the frame tight under the roof load.'],rod:['Floor beam (Rot)','Beam fixed to the posts that carries the joists and floor; joist ends are tenoned into it.'],tong:['Joist (Tong)','Timbers laid across the floor beams at intervals to carry the floorboards.'],phrueng:['Rim beam (Phrueng)','Beam around the edge of the floor that takes the joist ends and the base of the walls.'],floor:['Floorboards','Tongue-and-groove boards fitted together without nails.'],ase:['Wall plate (Pae Hua Sao / A-se)','Runs along the house on top of the posts, taking the rafters and spreading their load evenly to the posts.'],khue:['Tie beam (Khue)','Spans across the house to tie each pair of posts so they cannot spread apart.'],dang:['King post (Sao Dang)','Short post standing on the middle of a tie beam, supporting the peak of the gable.'],okkai:['Ridge beam (Ok Kai)','Runs along the house on the king posts; the highest line of the roof.'],chanthan:['Rafter (Chanthan)','Slopes from the ridge beam over the wall plate and on out to form the eaves. Main rafters sit on the post lines, common rafters between them.'],pae:['Purlin (Pae Lan)','Laid across the rafters along the roof, tying them together and carrying the battens.'],ranaeng:['Batten (Ranaeng)','Close-set thin strips on the purlins that the roof tiles hook onto, such as turtle-scale clay tiles.'],panlom:['Bargeboard (Panlom)','Board along the gable edge of the roof that keeps wind off the tiles; its top ends in a swan-tail.'],ngao:['Bargeboard scroll (Ngao)','The upturned lower end of the bargeboard, a signature motif of Central Thai houses.'],lukfak:['Gable panels (Luk Fak)','The gable is built as framed Pakon panels and can be dismantled.'],kansat:['Lower eave (Kansat)','A lower, flatter roof extending from the main eaves for shade and rain cover.'],taokhaen:['Eave bracket (Tao Khaen)','Diagonal strut from the post up to the long lower eave.'],lukkrong:['Balusters (Luk Krong)','Rows of wooden bars in a frame around the terrace to prevent falls.']}},
  tb:['Skip','Back','Next','Start'],step:(i,n)=>`Step ${i} of ${n}`},
 r:[
 {name:'Central',tg:'River plains · seasonal floods',
  intro:'Developed for river floodplains with seasonal flooding and a hot, humid climate.',
  sec:[['Structure & form','Posts lean slightly inward to resist wind and spread loads. The steep gable roof (45–60°) sheds rain quickly and lets heat escape. Gable ends are decorated with Panlom bargeboards and Tua Ngao scroll finials.'],['Layout','Houses are grouped around an open terrace (Chan): Ho Nang (sitting pavilion), Ho Non (sleeping house), the kitchen house and Ho Nok (bird pavilion), linked by the terrace and verandas.'],['Walls','Pakon walls (tongue-and-groove boards set in raised frames) or Sai Bua walls (boards with cover battens). Windows are narrow and taper upward, following the leaning posts.']],
  b:[
  {name:'House cluster',sub:'Several houses around a terrace',f:['Ho Non (sleeping house) sits innermost and is the largest and tallest','Ho Nang is open at the front; its back wall uses Sai Bua boards','The kitchen house stands across the terrace to reduce fire risk','Ho Nok has open slatted walls for keeping and watching birds','The central terrace links every house; some homes leave an opening so a large tree grows through for shade','The veranda sits under the eaves of Ho Non; floors step down from house to veranda to terrace'],
   z:[['Ho Non','Main sleeping house, the largest and tallest in the cluster'],['Veranda','Covered floor in front of Ho Non, one step below the rooms; shaded sitting area'],['Ho Nang','Pavilion open at the front for sitting, receiving guests and daytime rest'],['Kitchen house','Cooking, kept apart from the sleeping house against fire and smoke'],['Ho Nok','Small slatted pavilion for keeping and watching birds'],['Central terrace','Open timber deck linking every house; used for chores, merit-making and large gatherings'],['Under-floor space','Tall open space beneath Ho Non for tools and daytime rest']]},
  {name:'Ho Non',sub:'Main house',f:['Steep gable roof of 45–60° (the model uses 52°), curving gently like the hull of a junk, sheds rain quickly','Panlom bargeboards end in a Tua Ngao scroll at the bottom and a Hang Hong (swan tail) at the top','Posts lean inward about 1–2 cm per metre of height, resisting wind and pressing the frame tight','Pakon walls: framed timber panels','Narrow windows taper upward along the posts; shutters open flat against the wall','Brackets support the long eaves','High under-floor space clears seasonal floods'],
   z:[['Bedroom','Closed room for sleeping and keeping valuables'],['Veranda','Covered floor under the eaves, one step below the room'],['Terrace','Open timber deck for chores, guests and access to other houses'],['Under-floor space','Tall and open; for tools, daytime rest and letting floodwater pass']]},
  {name:'Kitchen house',sub:'Separate from Ho Non',f:['Built apart from Ho Non to reduce fire risk and smoke','Slatted walls with gaps let smoke and heat escape','"Sun-ray gable": slats set in rays vent smoke under the roof','Inside is a hearth: a timber box filled with earth under the stove'],
   z:[['Kitchen','Cooking area with an earth-filled hearth box'],['Kitchen terrace','For washing and preparing food; water jars stand here'],['Under-floor space','Storage for firewood and utensils']]}]},
 {name:'North',tg:'Mountains · cool winters',
  intro:'Lanna houses are designed to keep out the cold of winter and the strong winds of mountain valleys, so the interior is enclosed and warm.',
  sec:[['Structure & form','The gable roof is lower than in the Central region, with long eaves wrapping the house against sun and driving rain. Crossed boards on the peak, called Kalae, are believed to ward off evil and also secure the bargeboards.'],['Layout','A closed sleeping house with very small windows (or Pong Iam vents) opens onto the Toen, a semi-open multi-purpose hall, and a terrace with a Ran Nam shelf for drinking-water pots at the front.'],['Walls','Overlapping clapboards or Fa Lai sliding-vent walls. Walls lean outward at the top, the opposite of the Central region, to let in light and add usable space inside.']],
  b:[
  {name:'Kalae house',sub:'Lanna twin house',f:['"Kalae": crossed boards on the gable peak extending the bargeboards, believed to ward off evil and to secure the bargeboards','Twin house: two gable roofs side by side with a "Hong Rin" gutter between them (see the roof plan)','Low-pitched roof with low eaves against cold winds','Clapboard walls lean outward at the top, the opposite of the Central region, letting in light and adding space','Bedroom windows are very small, or simply "Pong Iam" vents','"Ham Yon": a carved board above the bedroom door, believed to ward off harm'],
   z:[['Bedroom','Shared family bedroom; solid walls, warm, Ham Yon above the door'],['Toen','Semi-open hall for guests, sitting and guest sleeping'],['Terrace','Open deck below the Toen for chores and drying'],['Ran Nam','Shelf for drinking-water pots with a little roof, to welcome visitors'],['Under-floor space','Farm tool storage and work area']]},
  {name:'Long Khao',sub:'Lanna rice granary',f:['Stores unhusked rice for the whole year','Raised high on many posts to carry the weight of grain','Walls flare outward and deep eaves keep rain off','Open under-floor space lets air through and reduces damp'],
   z:[['Rice store','Holds unhusked rice for the year'],['Under-floor space','Tool storage and shaded work area']]}]},
 {name:'Northeast',tg:'High plateau · long dry season',
  intro:'Isan houses reflect simplicity and modesty, suit the dry, very hot climate, and follow the customs of Heet Sip Song Khong Sip Si (the twelve monthly rites and fourteen codes of conduct).',
  sec:[['Structure & form','Gable roofs that are not very tall, covered with wooden shingles, hooked clay tiles or cogon grass, without the ornate decoration of the Central or Northern regions.'],['Layout','House types follow use and family size: Ruean Koei, a mid-sized house with a lower Koei platform in front for guests and handicrafts; Ruean Faet, twin houses side by side with a "Hang Hin" gutter between them, sharing a terrace; and Ruean Khong, built beside the main house on its own posts and frame, sharing no posts with it.'],['Walls','Timber boards laid vertically or horizontally, sometimes woven bamboo (Aem). Windows are small and few to keep out cold winds and dust.']],
  b:[
  {name:'Ruean Koei',sub:'Main house and Koei',f:['The main house holds the bedrooms and a shrine room; solid walls, few windows','"Koei": a lower platform in front of the main house under a lean-to roof','"Chan Daed": an open, unroofed sun terrace','Tall under-floor space for weaving, a bamboo daybed and tools','"Aem" walls: woven bamboo set into timber frames','Thatched roof; a simple form with little decoration'],
   z:[['Hong Poeng','Room for the house spirits and valuables; outsiders do not enter'],['Parents\' room','Bedroom of the parents, the house owners'],['Hong Suam','Bedroom of the daughter and son-in-law ("Suam" here means bedroom in Isan)'],['Koei','Lower roofed platform for guests, meals and daytime naps'],['Chan Daed','Open terrace for drying crops and entering the house'],['Under-floor space','For weaving, a daybed and storing tools']]},
  {name:'Lao Khao',sub:'Isan rice barn',f:['Rice barn standing apart from the house','Raised high against damp and rats','No windows; a small door reached by a ladder','Walls flare slightly outward to keep rain off'],
   z:[['Rice store','Holds unhusked rice; small door reached by ladder'],['Under-floor space','Open below so the barn stays dry']]}]},
 {name:'South',tg:'Heavy rain · monsoon winds',
  intro:'Built to cope with the monsoon, rain almost all year, strong storms and damp rising from the ground.',
  sec:[['Structure & form','Posts are not buried but stand on Tin Sao footings (stone slabs or concrete piers), keeping out damp and termites and making it easy to level or move the house. Roofs may be gable, hip (good against wind from every direction) or Manila (a gable on top of a hip, with fretwork decoration).'],['Layout','Open and airy, with a Chan terrace and a lower Nok Chan outer terrace linking the sleeping house and kitchen. Floor levels step down according to the importance of each space.'],['Walls','Pakon panels or overlapping clapboards, with vents above doors and windows (open or fretwork panels) so air keeps moving and damp is driven out.']],
  b:[
  {name:'Gable house',sub:'Southern Thai house',f:['Posts rest on "Tin Sao" footings (concrete or stone) rather than in the ground: less termite and damp damage, and the house can be moved','Lower under-floor space than other regions reduces wind load','Gable roof of clay tiles, resistant to wind and rain','Slatted gables vent heat and moisture under the roof','Vents above doors and windows keep driving out damp'],
   z:[['Living hall','Multi-purpose room for sitting and guests'],['Bedroom','Enclosed bedroom'],['Terrace','Front terrace for sitting in the breeze'],['Under-floor space','Low; for storage and firewood, with breeze to reduce damp']]},
  {name:'Hip-roof house',sub:'Four-sided roof',f:['The hip roof slopes down on all four sides; with no gable to catch the wind, it resists storms well','Eaves wrap around the house, keeping rain off from every direction','Many windows ventilate the humid interior','Stands on Tin Sao footings like the gable house'],
   z:[['Bedroom 1','Left bedroom'],['Central hall','Hall for sitting and guests, opening to the front door'],['Bedroom 2','Right bedroom'],['Entry terrace','Small terrace at the front door'],['Under-floor space','Low and breezy; for storage']]},
  {name:'Manila-roof house',sub:'Gable on a hip roof',f:['Manila roof: hip slopes below and a small gable on top, good against wind while venting the roof space','The gable is decorated with fretwork that also lets heat out','Vents above doors and windows keep driving out damp','Chan and Nok Chan terraces step down by the importance of each space','Stands on Tin Sao footings rather than buried posts'],
   z:[['Living hall','Main room for sitting and guests'],['Bedroom','Enclosed bedroom with a vent above the window'],['Chan','Front terrace slightly below the house floor'],['Nok Chan','Outermost terrace one step lower, for work and access'],['Under-floor space','Low and breezy; for storage']]}]}]},

 ui:{title:'泰国四大地区传统民居',sub:'传统建筑教学工具 · 3D · 2D · X光',m:['平面 · 立面','写实','透视'],xr:'X光',

  asm:{t:'组装房屋',done:'组装完成 · 点击播放可再看一次',s:{foot:['安放柱础','用石板或水泥墩承托柱子，防潮防白蚁。'],post:['立柱','立起房柱和晒台柱，房柱略向内倾。不用柱础的地区，柱脚埋入地下约1–1.5米。'],frame:['地梁、搁栅、边梁','地梁插入柱中，搁栅铺在地梁上，边梁沿楼面四周，以榫头和木楔固定。'],floor:['铺地板','房屋和晒台地板以企口拼接，不用铁钉。'],wall:['安装墙板','框格板墙等墙板在地面预制，再逐片抬起装在柱间。'],khue:['横梁与檐檩','檐檩沿纵向、横梁沿横向拉结柱头，并装上承托披檐的檐托。'],dang:['脊瓜柱与脊檩','脊瓜柱立于横梁中央，承托脊檩。'],rafter:['架椽','椽子从脊檩搭到檐檩上，刻口锁定以防下滑。'],pae:['檩条与挂瓦条','檩条横铺在椽子上，再密钉挂瓦条。'],gable:['山墙与博风板','抬装山墙板，安装博风板和山尖饰件。'],tile:['铺屋面','铺瓦、木片瓦或茅草，压脊，并铺披檐。'],detail:['楼梯与栏杆','安装楼梯、栏杆和日用设施，房屋即可入住。']}},
  cl:{t:'房屋为何这样建造？',tabs:['洪水','降雨','风'],lv:h=>`水位 ${h} 米`,fl:h=>`楼面高 ${h} 米`,ok:d=>`楼面仍高出水面 ${d} 米`,bad:'洪水已淹到楼面',ang:a=>`屋顶坡度 ${a}°`,
   flood:['高架底层让洪水从屋下流过，房屋不阻挡水流，楼上的物品也安全。','中等高度的架空：山坡住宅很少积水，但仍可隔绝地面潮气。','高架底层可避开雨季洪水，旱季则是阴凉的劳作空间。','底层较低，因为这里抗风比防洪更重要；柱础可隔绝地面潮气。'],
   rain:['陡峭的屋顶让雨水迅速流下，不在瓦面积存；屋檐和披檐把雨水引离墙面。','长而低的屋檐把雨水引离屋身；双联屋中间有天沟（Hong Rin）承接雨水。','坡度适中的草顶或木片瓦顶，足以应对较短的雨季。','几乎全年多雨，屋檐环绕挡雨，通风口在雨后驱除湿气。'],
   wind:['风从底层和窗户穿过带走热量；内倾的柱子抵御侧风。','封闭的墙、小窗和低檐挡住寒风。','窗小而少，旱季可挡寒风和尘土；通透的底层让风吹过降温。','季风强劲：底层较低以减小风荷载，四坡和马尼拉式屋顶没有大面积山墙迎风。']},

   p:{khe:['斜脊梁（Khe）','四坡屋顶转角处的斜向椽梁，从檐口枋向上至屋脊，把斜坡荷载传到转角柱。'],sao:['柱','主柱埋入地下约1–1.5米（南部立于柱础上），每米高度内倾约1–2厘米，抵御侧风并在承受屋顶荷载时使结构更紧密。'],rod:['地梁','固定在柱子上的梁，承托搁栅和楼板，搁栅端部以榫头接入。'],tong:['搁栅','按间距搁在地梁上，承托地板。'],phrueng:['边梁','沿楼面边缘的梁，承接搁栅端部并作为墙体底座。'],floor:['楼板','企口拼接的木地板，无需铁钉。'],ase:['檐檩（柱头檩）','沿房屋纵向架在柱头上，承托椽子并把荷载均匀传给柱子。'],khue:['横梁','沿房屋横向架设，拉结左右成对的柱头，防止向外张开。'],dang:['脊瓜柱','立于横梁中央的短柱，支撑山墙最高点。'],okkai:['脊檩','沿房屋纵向架在脊瓜柱上，是屋顶最高的屋脊。'],chanthan:['椽子','从脊檩斜向搭在檐檩上并向外伸出成为屋檐；柱线上的为主椽，柱间的为次椽。'],pae:['檩条','沿屋顶纵向横搭在椽子上，把椽子连成整体并承托挂瓦条。'],ranaeng:['挂瓦条','密排在檩条上的细木条，用来挂瓦，例如龟鳞陶瓦。'],panlom:['博风板','沿山墙屋顶边缘的木板，防止风吹掀瓦片，上端为天鹅尾饰。'],ngao:['博风卷饰','博风板下端向上卷起的部分，是泰国中部民居的标志性纹样。'],lukfak:['山墙框格板','山墙由框格板组成，可以拆装。'],kansat:['披檐','比主屋顶更平缓的下层屋檐，从主檐延伸出来遮阳挡雨。'],taokhaen:['檐托','从柱子斜撑向上，承托外伸的披檐。'],lukkrong:['栏杆柱','晒台四周框中成排的木栏，防止跌落。']}},

 r:[
 {name:'中部',tg:'河流平原 · 季节性洪水',
  intro:'为应对季节性洪水泛滥的河流平原和湿热气候而发展。',
  sec:[['结构与造型','房柱略向内倾，以抵御风力并分散荷载。陡峭的双坡屋顶（45–60度）便于排雨和散热，山墙顶端饰以博风板（Panlom）和卷草饰（Tua Ngao）。'],['布局','多栋房屋围绕开敞的晒台（Chan）布置，包括坐厅（Ho Nang）、卧屋（Ho Non）、厨房屋和鸟亭（Ho Nok），以晒台和檐廊相连。'],['墙体','常用框格板墙（Pakon，企口木板嵌入框格）或压条板墙（Sai Bua）。窗户窄小，随柱子向上收窄。']],
  b:[
  {name:'组群住宅',sub:'围绕晒台的多栋房屋',f:['卧屋（Ho Non）位于最内侧，是最大最高的一栋','坐厅（Ho Nang）前部开敞，后墙为压条板墙（Sai Bua）','厨房屋位于晒台另一侧，以降低火灾风险','鸟亭（Ho Nok）四周为通透木栅，用于养鸟赏鸟','中央晒台连接各栋房屋，有些人家留洞让大树穿过晒台遮阴','檐廊位于卧屋檐下，地面由室内、檐廊到晒台逐级降低'],
   z:[['卧屋','主卧屋，组群中最大最高的一栋'],['檐廊','卧屋前檐下的地面，比室内低一级，用于荫下休憩'],['坐厅','前部开敞，用于起坐、待客和午休'],['厨房屋','烹饪之所，与卧屋分开以防火防烟'],['鸟亭','木栅小亭，用于养鸟赏鸟'],['中央晒台','连接各栋房屋的开敞木平台，用于家务、做功德和大型聚会'],['架空底层','卧屋下方高敞空间，存放工具、午间休息']]},
  {name:'卧屋',sub:'主屋 Ho Non',f:['双坡屋顶陡峭，45–60度（模型采用52度），微微下凹如帆船船底，利于快速排雨','博风板下端为卷草饰（Tua Ngao），上端为天鹅尾饰（Hang Hong）','柱子每米高度约内倾1–2厘米，抵御侧风并使结构受压更紧密','框格板墙（Pakon）','窗户窄小，随柱向上收窄，窗扇外开贴墙','斜撑承托外伸的长檐','高架底层可避洪水'],
   z:[['卧室','封闭房间，用于睡眠和收藏贵重物品'],['檐廊','檐下地面，比室内低一级'],['晒台','开敞木平台，用于家务、待客并通往其他房屋'],['架空底层','高敞通透，存放工具、午休，洪水时让水流通过']]},
  {name:'厨房屋',sub:'与卧屋分开',f:['与卧屋分开建造，减少火灾风险和油烟','木条墙留有缝隙，便于排烟散热','“太阳纹山墙”：木条呈放射状排列，帮助屋顶下排烟','屋内设灶台：盛土的木框，上置炉灶'],
   z:[['厨房','烹饪处，设盛土灶台'],['厨房晒台','洗涤和备菜，放置水缸'],['架空底层','存放柴火和器具']]}]},
 {name:'北部',tg:'山地 · 冬季寒冷',
  intro:'兰纳民居为抵御冬季寒冷和山谷强风而设计，室内较为封闭温暖。',
  sec:[['结构与造型','双坡屋顶比中部低缓，长檐包覆屋身以遮阳挡雨。屋脊上的交叉木板称为“卡莱”（Kalae），相传可辟邪，同时固定博风板。'],['布局','封闭的卧屋窗户极小（或设通风口 Pong Iam），连接半开敞的多功能厅（Toen），以及前方设有饮水罐架（Ran Nam）的晒台。'],['墙体','采用鱼鳞式搭接木板墙或推拉式通风墙（Fa Lai）。墙体上部向外倾，与中部相反，以便采光并增加室内使用空间。']],
  b:[
  {name:'卡莱屋',sub:'兰纳双联屋 Kalae',f:['交叉博风板（Kalae）：山墙顶端相交延伸的木板，相传可辟邪，并固定博风板','双联屋：两座双坡屋顶并列，中间设天沟（Hong Rin）承接雨水（见屋顶平面）','屋顶坡度较缓，屋檐低垂，抵挡寒风','搭接木板墙上部外倾，与中部相反，便于采光、增加空间','卧室窗户极小，或仅设通风口（Pong Iam）','门楣雕板（Ham Yon）：卧室门上方的雕花木板，相传可辟邪'],
   z:[['卧室','全家共用卧室，墙体封闭温暖，门上有门楣雕板'],['半敞厅','半开敞空间（Toen），用于待客、起坐和客人留宿'],['晒台','比厅低一级的开敞平台，用于家务和晾晒'],['饮水架','带小屋顶的饮水罐架（Ran Nam），招待来客'],['架空底层','存放农具，兼作工作场所']]},
  {name:'粮仓',sub:'兰纳谷仓 Long Khao',f:['储存全年食用的稻谷','高架于多根柱子上，承受稻谷重量','墙体外倾、屋檐深远，防止雨水溅入','底层通透通风，减少潮湿'],
   z:[['储粮间','储存全年稻谷'],['架空底层','存放工具，遮阴工作']]}]},
 {name:'东北部',tg:'高原 · 旱季漫长',
  intro:'依善（Isan）民居体现简朴、知足的生活，适应干旱酷热的气候，并遵循“十二月习俗、十四条规范”（Heet Sip Song Khong Sip Si）的信仰。',
  sec:[['结构与造型','双坡屋顶不太高，覆以木片瓦、挂钩陶瓦或白茅草，不像中部和北部那样有繁复装饰。'],['布局','按用途和家庭规模分为：低台屋（Ruean Koei），中等规模，前方伸出较低的低台用于待客和手工劳作；双联屋（Ruean Faet），两栋并建，中间设天沟（Hang Hin），共用晒台；厢屋（Ruean Khong），建在主屋旁，有独立的柱子和框架，不与主屋共用柱子。'],['墙体','木板竖铺或横铺，部分采用竹编墙（Aem）。窗户小而少，以挡寒风和尘土。']],
  b:[
  {name:'低台屋',sub:'主屋与低台 Ruean Koei',f:['主屋设卧室和祭祀间，墙体封闭，窗户少','低台（Koei）：主屋前较低的平台，上覆单坡棚顶','晒台（Chan Daed）：无顶的露天平台','底层高敞，用于织布、放竹床和存放工具','竹编墙（Aem）：竹编板嵌入木框','茅草屋顶，造型简朴，少有装饰'],
   z:[['祭祀间','供奉家神、存放贵重物品，外人不入（Hong Poeng）'],['父母卧室','屋主夫妇的卧室'],['女儿卧室','女儿与女婿的卧室（Hong Suam，依善话“Suam”此处指卧室）'],['低台','有顶的低平台（Koei），用于待客、用餐和午睡'],['晒台','露天平台（Chan Daed），晾晒农作物，也是上屋通道'],['架空底层','织布、放竹床、存放工具']]},
  {name:'谷仓',sub:'依善谷仓 Lao Khao',f:['与住屋分开的谷仓','高架防潮防鼠','无窗，小门需架梯上下','墙体略向外倾，防止雨水溅入'],
   z:[['储粮间','储存稻谷，小门需架梯进入'],['架空底层','底部通透，保持谷仓干燥']]}]},
 {name:'南部',tg:'多雨 · 季风强劲',
  intro:'为应对季风、几乎全年多雨、强烈风暴和地面高湿度而建。',
  sec:[['结构与造型','柱子不埋入地下，而是立于柱础（Tin Sao，石板或水泥墩）上，防潮防白蚁，也便于调平或搬迁。屋顶有双坡、四坡（各方向抗风俱佳）和马尼拉式（双坡与四坡结合，饰以镂空木雕）。'],['布局','注重通透开敞，以晒台（Chan）和外晒台（Nok Chan）连接卧屋与厨房，地面按空间重要性逐级降低。'],['墙体','常用框格板墙或鱼鳞式搭接木板墙，门窗上方设通风口（通透木栅或镂空雕花），保持空气流通、驱除湿气。']],

  cur.traverse(o=>{const u=o.userData;if(!o.isMesh||u.plan||u.zone||u.v2||!u.st||u.st==='none')return;(g[u.st]=g[u.st]||[]).push(o);u.p0=o.position.clone();u.dl=Math.random()*.7});
  asm={s:ORDER.filter(k=>g[k]).map(k=>({k,m:g[k]})),i:0,t0:0,play:true,fin:false};$('asmP').hidden=false;$('asmBtn').setAttribute('aria-pressed',true);$('views').hidden=true;hint.classList.add('off');asmGo(0)}
function asmGo(i){asm.i=i;asm.fin=false;asm.t0=performance.now();asm.s.forEach((st,j)=>st.m.forEach(o=>{o.visible=j<i;o.position.copy(o.userData.p0)}));asmUI();render()}
function asmTick(now){const st=asm.s[asm.i],t=(now-asm.t0)/1000;let busy=false;
  st.m.forEach(o=>{const k=Math.min(1,Math.max(0,(t-o.userData.dl)/1.1));o.visible=k>0;o.position.copy(o.userData.p0);o.position.y+=(1-(1-Math.pow(1-k,3)))*5;if(k<1)busy=true});
  if(!busy&&asm.play&&t>2.4){if(asm.i<asm.s.length-1)asmGo(asm.i+1);else{asm.play=false;asm.fin=true;asmUI()}}}
function asmUI(){const t=U().asm,n=asm.s.length,st=asm.s[asm.i],x=t.s[st.k];
  $('asmT').textContent=t.t;$('asmN').textContent=`${asm.i+1} / ${n}`;$('asmBar').style.width=((asm.i+1)/n*100)+'%';
  $('asmH').textContent=x[0];$('asmD').textContent=asm.fin?t.done:x[1];$('asmPlay').classList.toggle('paused',!asm.play)}
function asmStop(){if(!asm)return;asm.s.forEach(st=>st.m.forEach(o=>{o.position.copy(o.userData.p0);o.visible=true}));asm=null;$('asmP').hidden=true;$('views').hidden=false;$('asmBtn').setAttribute('aria-pressed',false);setView(1)}
$('asmBtn').addEventListener('click',()=>asm?asmStop():asmStart());
$('asmX').addEventListener('click',asmStop);
$('asmPlay').addEventListener('click',()=>{if(asm.fin){asm.play=true;asmGo(0)}else{asm.play=!asm.play;if(asm.play)asm.t0=performance.now()-2.5e3*(asm.s[asm.i].m.every(o=>o.visible&&o.position.equals(o.userData.p0))?1:0);asmUI()}});
$('asmPrev').addEventListener('click',()=>{asm.play=false;asmGo(Math.max(0,asm.i-1))});
$('asmNext').addEventListener('click',()=>{asm.play=false;if(asm.i<asm.s.length-1)asmGo(asm.i+1);else{asmGo(asm.i);asm.fin=true;asmUI()}});

/* ---------- จำลองสภาพอากาศ ---------- */
const cl={on:false,tab:'flood',lv:1};
const waterM=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,uniforms:{uT:{value:0}},
  vertexShader:`varying vec2 vP;uniform float uT;
    void main(){vP=position.xy;vec3 p=position;
      p.z+=0.045*sin(p.x*0.31+uT*1.1)*cos(p.y*0.22-uT*0.7)+0.02*sin(p.x*0.9-p.y*0.6+uT*2.3)+0.012*sin((p.x+p.y)*1.7+uT*3.1);
      gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}`,
  fragmentShader:`varying vec2 vP;uniform float uT;
    void main(){float d=length(vP)/72.0;
      float a=smoothstep(1.0,0.45,d)*0.93;
      vec3 mud=vec3(0.50,0.40,0.24),tea=vec3(0.36,0.42,0.30),deep=vec3(0.22,0.28,0.25);
      vec3 c=mix(mud,tea,0.5+0.5*sin(vP.x*0.13+vP.y*0.09));
      c=mix(c,deep,smoothstep(0.2,0.9,d)*0.45);
      float s=0.5+0.5*sin(vP.x*1.6+uT*1.9+sin(vP.y*0.8+uT*0.6)*2.2);
      float s2=0.5+0.5*sin(vP.y*2.1-uT*1.4+sin(vP.x*0.7)*1.5);
      c+=vec3(0.16,0.15,0.12)*smoothstep(0.86,1.0,s*s2)*(1.0-d*0.6);
      gl_FragColor=vec4(c,a);}`});
const flood=new THREE.Mesh(new THREE.PlaneGeometry(150,150,40,40),waterM);flood.rotation.x=-PI/2;flood.visible=false;flood.renderOrder=2;scene.add(flood);
const streakM=new THREE.MeshBasicMaterial({color:0xf2ead8,transparent:true,opacity:.32,depthWrite:false});
const debrisM=[new THREE.MeshStandardMaterial({color:0x6b4f2a,roughness:.9}),new THREE.MeshStandardMaterial({color:0x5f7f3a,roughness:.9}),new THREE.MeshStandardMaterial({color:0xc9b48a,roughness:.8})];
const floodFX=new THREE.Group();floodFX.visible=false;scene.add(floodFX);
function floodSetup(){floodFX.clear();const c=fit.getCenter(V()),s=fit.getSize(V());
  for(let i=0;i<34;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(1.2+Math.random()*2.2,.04+Math.random()*.03),streakM);m.rotation.x=-PI/2;
    m.userData={k:'s',z:c.z+(Math.random()-.5)*(s.z+30),ph:Math.random(),L:s.x+50,x0:c.x-s.x/2-25};floodFX.add(m)}
  for(let i=0;i<24;i++){const g=new THREE.Mesh(new THREE.BoxGeometry(.3+Math.random()*.4,.05,.14+Math.random()*.12),debrisM[i%3]);
    g.userData={k:'d',z:c.z+(Math.random()-.5)*(s.z+20),ph:Math.random(),L:s.x+50,x0:c.x-s.x/2-25,r:Math.random()*PI};floodFX.add(g)}}

const RN=700,rainP=new Float32Array(RN*6),rainG=new THREE.BufferGeometry();rainG.setAttribute('position',new THREE.BufferAttribute(rainP,3));
const rain=new THREE.LineSegments(rainG,new THREE.LineBasicMaterial({color:0x9fc6e2,transparent:true,opacity:.75}));rain.frustumCulled=false;rain.visible=false;scene.add(rain);
const dropM=new THREE.MeshStandardMaterial({color:0x2f8fd0,emissive:0x0d3a5c,roughness:.2}),windM=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.85});
const drops=new THREE.Group(),winds=new THREE.Group();scene.add(drops,winds);
function clSetup(){
  drops.clear();winds.clear();const c=fit.getCenter(V()),s=fit.getSize(V());
  for(let i=0;i<RN;i++){const x=c.x+(Math.random()-.5)*28,z=c.z+(Math.random()-.5)*28,y=Math.random()*14;rainP.set([x,y,z,x-.06,y-.5,z],i*6)}rainG.attributes.position.needsUpdate=true;
  if(DM.roof){const {A,B,ay,z0r,x0r,RL,sag}=DM,paths=[A,B].map(e=>{const sg=e[0]>z0r?1:-1,pts=[];
      for(let k=0;k<=8;k++){const t=.95*(1-k/8);pts.push(V(0,e[1]+(ay-e[1])*t-sag*Math.sin(PI*t)+.09,e[0]+(z0r-e[0])*t))}
      if(DM.ks){const k=DM.ks,yk=z=>DM.yw-k.drop-(Math.abs(z-z0r)-DM.D/2-.02)*k.kt;pts.push(V(0,yk(e[0])+.1,e[0]));const zk=z0r+sg*(DM.D/2+k.ov);pts.push(V(0,yk(zk)+.08,zk))}
      const l=pts[pts.length-1];pts.push(V(0,l.y-.4,l.z+sg*.12),V(0,.06,l.z+sg*.3));
      const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+pts[i].distanceTo(pts[i-1]));return {pts,cum}});
    for(let i=0;i<56;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.075,8,6),dropM);m.userData={x:x0r+(Math.random()-.5)*(RL-.6),p:paths[i%2],ph:Math.random()};drops.add(m)}}
  const ymax=(DM.yw||4)+1.2;
  for(let i=0;i<60;i++){const g=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(1.2,.035,.035),windM),cn=new THREE.Mesh(new THREE.ConeGeometry(.08,.24,8),windM);cn.rotation.z=-PI/2;cn.position.x=.7;g.add(b,cn);
    g.userData={y:.25+Math.random()*ymax,z:c.z+(Math.random()-.5)*(s.z+4),ph:Math.random()};winds.add(g)}
  floodSetup();clApply();
}
function clTick(now){const T=now/1000;
  if(cl.tab==='flood'){waterM.uniforms.uT.value=T;floodFX.children.forEach(m=>{const d=m.userData,x=d.x0+((T*(d.k==='s'?1.5:.7)/d.L+d.ph)%1)*d.L;
    if(d.k==='s'){m.position.set(x,cl.lv+.035,d.z)}else{m.position.set(x,cl.lv+.03+.025*Math.sin(T*1.7+d.ph*9),d.z+.35*Math.sin(T*.6+d.ph*6));m.rotation.set(.12*Math.sin(T*1.3+d.ph*5),d.r+T*.15,.1*Math.sin(T*1.1+d.ph*7))}})}
  if(cl.tab==='rain'){for(let i=0;i<RN;i++){let y=rainP[i*6+1]-.32;if(y<0)y+=14;rainP[i*6+1]=y;rainP[i*6+4]=y-.5}rainG.attributes.position.needsUpdate=true;
    drops.children.forEach(m=>{const d=m.userData,P=d.p,tot=P.cum[P.cum.length-1],s=((T*2.2/tot+d.ph)%1)*tot;let i=1;while(i<P.cum.length-1&&P.cum[i]<s)i++;const k=(s-P.cum[i-1])/((P.cum[i]-P.cum[i-1])||1),a=P.pts[i-1],b=P.pts[i];m.position.set(d.x,a.y+(b.y-a.y)*k,a.z+(b.z-a.z)*k)})}
  if(cl.tab==='wind'){const x0=fit.min.x-7,R=fit.max.x-fit.min.x+14;winds.children.forEach(g=>{const d=g.userData;g.position.set(x0+((T*3/R+d.ph)%1)*R,d.y,d.z)})}}
function clApply(){const on=cl.on&&!is2d();flood.visible=on&&cl.tab==='flood';floodFX.visible=flood.visible;flood.position.y=cl.lv;flood.position.x=fit.getCenter(V()).x;flood.position.z=fit.getCenter(V()).z;
  rain.visible=drops.visible=on&&cl.tab==='rain';winds.visible=on&&cl.tab==='wind';render()}
function clUI(){if(!cl.on)return;const t=U().cl,yf=DM.yf||0;$('clT').textContent=t.t;$('clP').dataset.tab=cl.tab;
  $('clTabs').innerHTML=['flood','rain','wind'].map((k,i)=>`<button data-c="${k}" aria-pressed="${k===cl.tab}">${t.tabs[i]}</button>`).join('');
  let h='';if(cl.tab==='flood'){const d=yf-cl.lv;h=`<div class="rng"><input type="range" id="clR" min="0" max="3" step="0.05" value="${cl.lv}" aria-label="${t.lv(cl.lv.toFixed(2))}"><b>${t.lv(cl.lv.toFixed(2))}</b></div><span class="st ${d>0?'ok':'bad'}">${d>0?t.ok(d.toFixed(2)):t.bad}</span> <span class="st" style="background:rgba(0,0,0,.06)">${t.fl(yf.toFixed(2))}</span><p>${t.flood[ri]}</p>`}
  else if(cl.tab==='rain')h=`<span class="st" style="background:rgba(0,0,0,.06)">${t.ang(DM.ang||0)}</span><p>${t.rain[ri]}</p>`;else h=`<p>${t.wind[ri]}</p>`;
  $('clB').innerHTML=h;const r=$('clR');if(r)r.addEventListener('input',e=>{cl.lv=+e.target.value;clApply();clUI2()})}
function clUI2(){const t=U().cl,d=(DM.yf||0)-cl.lv,b=$('clB');b.querySelector('.rng b').textContent=t.lv(cl.lv.toFixed(2));const s=b.querySelector('.st');s.className='st '+(d>0?'ok':'bad');s.textContent=d>0?t.ok(d.toFixed(2)):t.bad}
function clStart(){asmStop();if(is2d())setMode('3d');cl.on=true;$('clP').hidden=false;$('views').hidden=true;$('clBtn').setAttribute('aria-pressed',true);hint.classList.add('off');clUI();clApply()}
function clStop(){if(!cl.on)return;cl.on=false;$('clP').hidden=true;$('views').hidden=false;$('clBtn').setAttribute('aria-pressed',false);clApply()}
$('clBtn').addEventListener('click',()=>cl.on?clStop():clStart());$('clX').addEventListener('click',clStop);
$('clTabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){cl.tab=b.dataset.c;clUI();clApply()}});
$('dimBtn').addEventListener('click',()=>{showD=!showD;setView(1)});

/* ---------- วิธีใช้ (ทัวร์สั้น) ---------- */
const TS=[{},{sel:'#pickBtn'},{sel:'#langBtn'},{sel:'#modes',pre:()=>setMode('3d')},{sel:'#box',pre:()=>setMode('3d'),inside:1},{sel:'#views',pre:()=>{sub='plan';setMode('2d');setView()}},{sel:'#views',pre:()=>{xmode='struct';labelsHTML();setMode('xray');setView(1)}},{sel:'#acts',pre:()=>{xmode='zone';labelsHTML();setMode('3d')}},{sel:'#tools',pre:()=>setMode('3d')},{sel:'#infoBtn',pre:()=>setMode('3d')}];
const TC=['#b8322a','#c77a1e','#2f6f8f','#3c7a4a','#7a4f9a','#1f7a7a','#a4493d','#8a6a2a','#2f5fa0','#6b8e23','#9a3d6b','#4a6b2a'];
let ti=0;
function tourShow(){
  const st=TS[ti],u=U(),tx=u.tour[ti],n=TS.length;if(st.pre)st.pre();$('tcard').style.setProperty('--tc',TC[ti%TC.length]);
  $('tStep').textContent=u.step(ti+1,n);$('tH').textContent=tx[0];$('tP').textContent=tx[1];
  $('tSkip').textContent=u.tb[0];$('tPrev').textContent=u.tb[1];$('tPrev').hidden=ti===0;$('tNext').textContent=ti===n-1?u.tb[3]:u.tb[2];
  $('tDots').innerHTML=TS.map((_,i)=>`<i class="${i===ti?'on':''}"></i>`).join('');
  const spot=$('spot'),card=$('tcard'),el=st.sel&&document.querySelector(st.sel);
  if(!el){spot.style.cssText='left:50%;top:50%;width:0;height:0';card.style.cssText='left:50%;top:50%;transform:translate(-50%,-50%)';card.style.setProperty('--tc',TC[ti%TC.length]);return}
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const r=el.getBoundingClientRect(),p=8,vw=innerWidth,vh=innerHeight;
    spot.style.cssText=`left:${r.left-p}px;top:${r.top-p}px;width:${r.width+2*p}px;height:${r.height+2*p}px`;
    const cw=Math.min(380,vw-24),ch=card.offsetHeight,left=Math.max(12,Math.min(vw-cw-12,r.left+r.width/2-cw/2));
    let top=r.bottom+16;if(st.inside||top+ch>vh-12){top=r.top-ch-16;if(top<12)top=st.inside?Math.min(vh-ch-12,r.top+r.height*.55):vh-ch-12}
    card.style.cssText=`left:${left}px;top:${Math.max(12,top)}px;width:${cw}px`;card.style.setProperty('--tc',TC[ti%TC.length]);
  }));
}
function tourStart(){sheet(false);pick(false);asmStop();clStop();ti=0;$('tour').hidden=false;tourShow();$('tNext').focus()}
function tourEnd(){$('tour').hidden=true;xmode='zone';labelsHTML();setMode('3d');setView(1);try{localStorage.setItem('rt-tour','1')}catch(e){}}
$('tNext').addEventListener('click',()=>{if(ti<TS.length-1){ti++;tourShow()}else tourEnd()});
$('tPrev').addEventListener('click',()=>{if(ti>0){ti--;tourShow()}});
$('tSkip').addEventListener('click',tourEnd);
$('helpBtn').addEventListener('click',tourStart);
addEventListener('resize',()=>{if(!$('tour').hidden)tourShow()});

function fromHash(){const m=/^#(\w+)-(\d)$/.exec(location.hash);if(m){const r=R.findIndex(x=>x.id===m[1]);if(r>=0)return [r,Math.min(+m[2]-1,R[r].b.length-1)]}return [0,0]}
window.addEventListener('hashchange',()=>{const h=fromHash();go(h[0],h[1])});
function resize(){const w=box.clientWidth,h=box.clientHeight;if(!w)return;const dp=LITE?Math.min(1,devicePixelRatio):Math.max(1,Math.min(devicePixelRatio,2,Math.sqrt(4.2e6/(w*h))));if(renderer.getPixelRatio()!==dp)renderer.setPixelRatio(dp);renderer.setSize(w,h,false);persp.aspect=w/h;persp.updateProjectionMatrix()}
const ro=new ResizeObserver(()=>{resize();if(cur)setView(1)});

/* ---------- การแสดงผล: ปุ่มใหญ่ · กราฟิกเบา ---------- */
function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('off');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('off'),5000)}
function setBig(on,save){BIG=on;document.documentElement.classList.toggle('big',on);$('bigBtn').setAttribute('aria-pressed',on);if(save)try{localStorage.setItem('rt-big',on?'1':'0')}catch(e){}
  setTimeout(()=>{resize();if(cur)setView(1)},60)}
function setLite(on,save){LITE=on;sun.intensity=on?SUNP[sunP].i*1.1:SUNP[sunP].i;$('liteBtn').setAttribute('aria-pressed',on);if(save)try{localStorage.setItem('rt-lite',on?'1':'0')}catch(e){}
  renderer.shadowMap.enabled=!on;sun.castShadow=!on;scene.traverse(o=>{if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.needsUpdate=true);if(o.userData&&o.userData.m)o.userData.m.needsUpdate=true});
  ghosts.forEach(m=>m.needsUpdate=true);rain.geometry.setDrawRange(0,on?RN*2/3:RN*2);resize();render()}
$('bigBtn').addEventListener('click',()=>setBig(!BIG,1));$('liteBtn').addEventListener('click',()=>setLite(!LITE,1));
(()=>{let b=null,l=null;try{b=localStorage.getItem('rt-big');l=localStorage.getItem('rt-lite')}catch(e){}
  const touch=matchMedia('(pointer:coarse)').matches,mem=navigator.deviceMemory||8,cores=navigator.hardwareConcurrency||8;
  if(b==='1'||(b===null&&touch&&Math.min(innerWidth,innerHeight)>=700))setBig(true);
  if(l==='1'||(l===null&&(mem<=3||(touch&&cores<=4))))setLite(true);
  if(l===null){/* วัดความเร็วจริงช่วงแรก ถ้าช้ามากให้เปิดกราฟิกเบา */let n=0,t0=0;const f=t=>{if(LITE)return;if(!t0)t0=t;n++;if(t-t0<2500){render();requestAnimationFrame(f)}else if(n/((t-t0)/1000)<20){setLite(true);toast(U().set.auto)}};setTimeout(()=>requestAnimationFrame(f),1500)}
})();
const h0=fromHash();ri=h0[0];bi=h0[1];ui();build();info();
ro.observe(box);setView();
/* ---------- เปิดหน้า: เลือกภาษา → วิธีใช้ → ใช้งาน ---------- */
let seen=false,saved=null;try{seen=!!localStorage.getItem('rt-tour');saved=localStorage.getItem('rt-lang')}catch(e){}
$('wTour').checked=!seen;
document.querySelectorAll('#welcome .wl button').forEach(b=>{b.setAttribute('aria-pressed',saved?b.dataset.l===LG:false);b.addEventListener('click',()=>{
  const l=b.dataset.l;setLang(l);const w=$('welcome');w.classList.add('off');setTimeout(()=>w.hidden=true,360);
  if($('wTour').checked)setTimeout(tourStart,380);else $('box').focus&&cv.focus()})});
setTimeout(()=>{const f=document.querySelector('#welcome .wl button[aria-pressed=true]')||document.querySelector('#welcome .wl button');f.focus()},50);
}

</script>
